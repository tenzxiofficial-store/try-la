<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>rey kacak: Iky Imut Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #video { display: none; }
        .hud {
            position: absolute; top: 15px; left: 15px; color: #ffb6c1;
            font-family: 'Courier New', monospace; font-size: 11px;
            letter-spacing: 1px; pointer-events: none; opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="hud">rey kacak | iky imut</div>
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>

<script>
const videoElement = document.getElementById('video');
const canvasElement = document.getElementById('canvas');
const ctx = canvasElement.getContext('2d');

let particles = [];
const numParticles = 6000; 
let hX = window.innerWidth / 2, hY = window.innerHeight / 2, hScale = 1;
let currentGesture = "idle", angle = 0;

canvasElement.width = window.innerWidth;
canvasElement.height = window.innerHeight;

class Particle {
    constructor() {
        this.x = Math.random() * canvasElement.width;
        this.y = Math.random() * canvasElement.height;
        this.size = 0.5 + Math.random() * 0.4; // Paling halus
        this.vx = (Math.random() - 0.5) * 50; 
        this.vy = (Math.random() - 0.5) * 50;
        this.tx = this.x; this.ty = this.y;
        this.color = "#ffffff";
    }
    update() {
        if (currentGesture === "scatter") {
            this.x += this.vx; this.y += this.vy;
            if (this.x < 0 || this.x > canvasElement.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvasElement.height) this.vy *= -1;
            this.color = Math.random() > 0.5 ? "#a0e9ff" : "#ffffff";
        } else {
            this.x += (this.tx - this.x) * 0.18;
            this.y += (this.ty - this.y) * 0.18;
        }
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 3; ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * hScale, 0, Math.PI * 2);
        ctx.fill();
    }
}

for (let i = 0; i < numParticles; i++) particles.push(new Particle());

function getHeart(cx, cy, s) {
    let pts = [];
    for (let i = 0; i < 2500; i++) {
        let t = Math.random() * Math.PI * 2;
        let r = Math.sqrt(Math.random()); 
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        pts.push({x: cx + x * r * (15 * s), y: cy + y * r * (15 * s)});
    }
    return pts;
}

function getTextPoints(text, cx, cy, s, baseSize) {
    let pts = [];
    const off = document.createElement('canvas');
    const oCtx = off.getContext('2d');
    off.width = window.innerWidth; off.height = window.innerHeight;
    let fs = Math.floor(baseSize * s);
    oCtx.font = `bold ${fs}px Arial`;
    const w = oCtx.measureText(text).width;
    oCtx.fillText(text, cx - w/2, cy + fs/3);
    const data = oCtx.getImageData(0, 0, off.width, off.height).data;
    for (let y = 0; y < off.height; y += 5) {
        for (let x = 0; x < off.width; x += 5) {
            if (data[(y * off.width + x) * 4 + 3] > 120) pts.push({x, y});
        }
    }
    return pts;
}

function onResults(results) {
    ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    angle += 0.05;

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        hX = (1 - lm[9].x) * canvasElement.width;
        hY = lm[9].y * canvasElement.height;
        
        let depth = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y);
        hScale = depth * 5; 

        // Gesture Logic
        const isIndexUp = lm[8].y < lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y;
        const isFist = lm[8].y > lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y;
        const isOpen = lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y < lm[14].y;
        const isPeace = lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y > lm[14].y;

        let pts = [], color = "#ffffff";
        if (isIndexUp) { 
            currentGesture = "love"; color = "#ff69b4"; pts = getHeart(hX, hY, hScale); 
        } else if (isPeace) { 
            currentGesture = "text"; color = "#ff69b4"; pts = getTextPoints("iloveyouu", hX, hY, hScale, 70); 
        } else if (isFist) { 
            currentGesture = "iky"; color = "#ffb6c1"; pts = getTextPoints("iky imut", hX, hY, hScale, 100); 
        } else if (isOpen) { 
            currentGesture = "scatter"; 
        } else { 
            currentGesture = "idle"; 
        }

        particles.forEach((p, i) => {
            if (currentGesture === "scatter") {
                p.update();
            } else if (pts.length > 0) {
                let t = pts[i % pts.length];
                p.tx = t.x; p.ty = t.y; p.color = color; p.update();
            } else {
                let r = (80 * hScale) + (i % 40);
                p.tx = hX + Math.cos(i * 0.15 + angle) * r;
                p.ty = hY + Math.sin(i * 0.15 + angle) * r;
                p.color = "#ffffff"; p.update();
            }
            p.draw();
        });
    } else {
        particles.forEach(p => { p.update(); p.draw(); });
    }
}

const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8 });
hands.onResults(onResults);
const camera = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, width: 1280, height: 720 });
camera.start();
</script>
</body>
</html>
